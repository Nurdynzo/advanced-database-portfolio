# MongoDB (single-node replica set, required for multi-document transactions)
# and Redis, for running Portfolio 4 locally:  docker compose up -d
services:
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start; afterwards just reports status.
      test: ["CMD", "mongosh", "--quiet", "--eval",
             "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 5s

  redis:
    image: redis:7.4
    ports:
      - "6379:6379"

volumes:
  mongo-data:
